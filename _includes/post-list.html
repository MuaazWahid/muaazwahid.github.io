<ol class="post-grid">
{% for post in include.posts %}
  <li><a class="post-card" href="{{ post.url | relative_url }}">
    <div class="post-meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %-d, %Y' }}</time>
      <span class="sep" aria-hidden="true">·</span>
      <span>{{ post.kind | default: 'Note' | escape }}</span>
    </div>
    <h3>{{ post.title | escape }}</h3>
    {% if post.description %}<p class="post-desc">{{ post.description | escape }}</p>{% endif %}
  </a></li>
{% endfor %}
</ol>
