<ol class="post-list">
{% for post in include.posts %}
  <li><a class="post-link" href="{{ post.url | relative_url }}">
    <div class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %-d, %Y' }}</time><span>{{ post.kind | default: 'Note' | escape }}</span>{% if post.featured %}<span class="featured">Featured</span>{% endif %}</div>
    <div class="post-title"><h3>{{ post.title | escape }}</h3><span aria-hidden="true">↗</span></div>
    {% if post.description %}<p>{{ post.description | escape }}</p>{% endif %}
  </a></li>
{% endfor %}
</ol>
