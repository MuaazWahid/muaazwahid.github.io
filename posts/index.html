title: All posts
---
<section class="archive" aria-labelledby="archive-title">
  <a class="back-link" href="{{ '/' | relative_url }}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
    Home
  </a>
  <div class="archive-header">
    <p class="eyebrow">The archive</p>
    <h1 id="archive-title">Posts &amp; work</h1>
    <p>Notes, projects, and things worth sharing.</p>
  </div>
  {% if site.posts.size > 0 %}{% include post-list.html posts=site.posts %}{% else %}
  <div class="empty">
    <span class="empty-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
    </span>
    <div>
      <p class="empty-title">Nothing here just yet.</p>
      <p class="empty-note">Check back soon.</p>
    </div>
  </div>
  {% endif %}
</section>
