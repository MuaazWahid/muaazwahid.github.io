<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.data.profile.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.data.profile.name | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="Posts" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="home-mark" href="{{ '/' | relative_url }}" aria-label="Home"><span aria-hidden="true">/.</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/#about' | relative_url }}">About</a><a href="{{ '/#posts' | relative_url }}">Posts</a></nav>
      <div class="appearance" hidden>
        <label for="theme">Theme</label>
        <select id="theme" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </div>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer"><span>© {{ site.time | date: '%Y' }} {{ site.data.profile.name | escape }}</span>{% if site.posts.size > 0 %}<a href="{{ '/feed.xml' | relative_url }}">RSS</a>{% endif %}</footer>
  </div>
</body>
</html>
